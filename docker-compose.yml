# Production-like local stack. Put secrets in backend/.env (DATABASE_URL may point at Neon).
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:3010
      FRONTEND_URL: http://localhost:3010
    ports: ["8010:8000"]
    volumes: ["api-data:/app/data"]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8010/api
    ports: ["3010:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  api-data:
